name: Docker

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - .github/workflows/docker.yml
      - scripts/test-docker-compat.js

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
            echo "tags=${REPO}:${VERSION},${REPO}:latest" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ github.sha }}"
            echo "tags=${REPO}:dev,${REPO}:sha-${SHA::7}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${REPO}:pr-test" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.tags.outputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image locally
        run: docker build -t beads-ui:test .

      - name: Create test workspace
        run: |
          mkdir -p /tmp/test-workspace/.beads
          echo '{"database":"dolt"}' > /tmp/test-workspace/.beads/metadata.json

      - name: Start container
        run: |
          docker run -d --name beads-ui-test \
            --init \
            -p 3000:3000 \
            -v /tmp/test-workspace:/data \
            beads-ui:test

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/healthz; then
              echo ""
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Health check timed out"
          docker logs beads-ui-test
          exit 1

      - name: Verify bd binary
        run: docker exec beads-ui-test bd --version

      - name: Verify real Beads workflows without host data or network access
        run: |
          docker run --rm --network none --entrypoint node \
            -e BDUI_DOCKER_TEST=1 \
            -v "$PWD/scripts/test-docker-compat.js:/opt/beads-ui/scripts/test-docker-compat.js:ro" \
            beads-ui:test /opt/beads-ui/scripts/test-docker-compat.js

      - name: Verify non-root user
        run: |
          USER=$(docker exec beads-ui-test whoami)
          if [ "$USER" != "node" ]; then
            echo "Expected user 'node', got '$USER'"
            exit 1
          fi

      - name: Verify graceful shutdown
        run: |
          docker stop beads-ui-test
          EXIT_CODE=$(docker inspect beads-ui-test --format='{{.State.ExitCode}}')
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Container exited with code $EXIT_CODE (expected 0)"
            docker logs beads-ui-test
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f beads-ui-test 2>/dev/null || true
